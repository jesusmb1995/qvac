version: 0.1
android_test_host: amazon_linux_2

phases:
  pre_test:
    commands:
      # Download and push pre-cached models if URL file exists in test package
      - |-
        MODELS_URL_FILE="$DEVICEFARM_TEST_PACKAGE_PATH/models-url.txt"
        if [ -f "$MODELS_URL_FILE" ]; then
          echo "Pre-cached models detected, downloading from S3..."
          MODELS_URL=$(cat "$MODELS_URL_FILE")
          URL_LEN=${#MODELS_URL}
          echo "URL length: ${URL_LEN} chars"

          if [ "$URL_LEN" -lt 50 ]; then
            echo "ERROR: URL seems too short (${URL_LEN} chars), skipping cache"
            echo "Falling back to normal model download"
          else
            START=$(date +%s)
            HTTP_CODE=$(curl -fSL -o /tmp/qvac-models.tar.gz -w '%{http_code}' "$MODELS_URL" 2>/tmp/curl-error.log) || true
            DL_TIME=$(( $(date +%s) - START ))
            DL_SIZE=$(du -h /tmp/qvac-models.tar.gz 2>/dev/null | cut -f1)
            echo "curl finished: HTTP ${HTTP_CODE}, ${DL_SIZE} in ${DL_TIME}s"

            if [ -f /tmp/curl-error.log ] && [ -s /tmp/curl-error.log ]; then
              echo "curl stderr:"
              cat /tmp/curl-error.log
            fi

            DL_BYTES=$(stat -c%s /tmp/qvac-models.tar.gz 2>/dev/null || echo 0)
            MIN_SIZE=$((100 * 1024 * 1024))
            if [ "$DL_BYTES" -lt "$MIN_SIZE" ]; then
              echo "ERROR: Downloaded file too small (${DL_BYTES} bytes, expected >100MB)"
              echo "File content (first 500 bytes):"
              head -c 500 /tmp/qvac-models.tar.gz || true
              echo ""
              echo "Falling back to normal model download"
              rm -f /tmp/qvac-models.tar.gz
            else
              echo "Extracting models..."
              mkdir -p /tmp/qvac-models
              tar xzf /tmp/qvac-models.tar.gz -C /tmp/qvac-models
              rm -f /tmp/qvac-models.tar.gz

              echo "Pushing models to device via adb..."
              adb shell mkdir -p /data/local/tmp/qvac-models
              START=$(date +%s)
              adb push /tmp/qvac-models/. /data/local/tmp/qvac-models/
              PUSH_TIME=$(( $(date +%s) - START ))
              echo "Models pushed to device in ${PUSH_TIME}s"
              rm -rf /tmp/qvac-models

              MODEL_COUNT=$(adb shell ls /data/local/tmp/qvac-models/ | wc -l)
              echo "Pre-cached ${MODEL_COUNT} model files on device"
            fi
          fi
        else
          echo "No pre-cached models (cache-models not enabled)"
        fi

      # Install and launch the app
      - |-
        echo "Installing app..."
        adb install -r "$DEVICEFARM_APP_PATH"
        echo "Launching app..."
        adb shell am start -n io.tether.qvac_test_consumer_mobile/.MainActivity
        sleep 5
        echo "App launched"

      # Periodic screenshots every 30s in the background
      - |-
        (while true; do
          TIMESTAMP=$(date +%s)
          adb shell screencap -p > "$DEVICEFARM_SCREENSHOT_PATH/screen-${TIMESTAMP}.png" 2>/dev/null
          sleep 30
        done) &
        echo "Screenshot capture started (every 30s)"

  test:
    commands:
      # Stream logcat, track test progress in real-time, detect completion
      - |-
        TIMEOUT=${DEVICEFARM_TIMEOUT:-5400}
        START=$(date +%s)
        PASSED=0
        FAILED=0
        COMPLETED=0
        EXPECTED="?"
        RESULTS_FILE="$DEVICEFARM_LOG_DIR/test-results.txt"

        touch "$RESULTS_FILE"
        adb logcat -c

        echo "Monitoring app logcat for test results (timeout: ${TIMEOUT}s)..."

        adb logcat ReactNativeJS:I *:S | while IFS= read -r line; do
          case "$line" in
            *"Registration ack"*"tests in queue"*)
              EXPECTED=$(echo "$line" | grep -oP '\d+(?= tests in queue)')
              echo "Registered: $EXPECTED tests expected"
              ;;
            *"✅"*"ms)"*)
              PASSED=$((PASSED+1))
              COMPLETED=$((COMPLETED+1))
              echo "[PASS $COMPLETED/$EXPECTED] $line"
              echo "PASS|$line" >> "$RESULTS_FILE"
              ;;
            *"❌"*"ms)"*)
              FAILED=$((FAILED+1))
              COMPLETED=$((COMPLETED+1))
              echo "[FAIL $COMPLETED/$EXPECTED] $line"
              echo "FAIL|$line" >> "$RESULTS_FILE"
              ;;
            *"❌"*"failed:"*)
              FAILED=$((FAILED+1))
              COMPLETED=$((COMPLETED+1))
              echo "[ERROR $COMPLETED/$EXPECTED] $line"
              echo "ERROR|$line" >> "$RESULTS_FILE"
              ;;
            *"Consumer shutting down"*)
              echo ""
              echo "========================================="
              echo "COMPLETE: $PASSED passed, $FAILED failed ($COMPLETED/$EXPECTED)"
              echo "========================================="
              break
              ;;
          esac

          NOW=$(date +%s)
          if [ $((NOW - START)) -ge $TIMEOUT ]; then
            echo "TIMEOUT after ${TIMEOUT}s ($PASSED passed, $FAILED failed, $COMPLETED/$EXPECTED completed)"
            exit 1
          fi
        done

  post_test:
    commands:
      # Capture full logcat
      - adb logcat -d ReactNativeJS:I *:S > "$DEVICEFARM_LOG_DIR/app-console.log"

      # Final screenshot
      - adb shell screencap -p > "$DEVICEFARM_SCREENSHOT_PATH/final.png" 2>/dev/null

      # Generate JUnit XML from captured test results (script is in the test package)
      - python3 $DEVICEFARM_TEST_PACKAGE_PATH/device-farm-gen-junit.py

artifacts:
  - $DEVICEFARM_LOG_DIR
